<!doctype html><meta charset="utf-8"><title>pele-animate demo</title>
<link rel="stylesheet" href="pele-animate.css">
<style>body{font:16px sans-serif;margin:2rem;--pele-accent:#4F378B}pre{margin:6rem 0;cursor:pointer}</style>
<pre class="d">flowchart LR
  A[Player] --> B{Token ok?}
  B -->|yes| C[License server]
  B -->|no| D[Reject]
  C --> E[Play]</pre>
<pre class="d">sequenceDiagram
  Player->>OTT: sign in
  OTT-->>Player: token
  Player->>DRM: token
  DRM-->>Player: license</pre>
<script type="module">
import { mount } from './node_modules/pele/dist/pele.js';
import { watch } from './pele-animate.js';
document.querySelectorAll('pre.d').forEach((el) => { mount(el, el.textContent); watch(el); });
</script>
