name: Feature request
description: Suggest a diagram type, option or icon
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
      description: Keep Mermaid source valid; extensions go through `@{ icon }` or `%%` comments.
