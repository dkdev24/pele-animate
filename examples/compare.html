<!doctype html><meta charset="utf-8"><title>pele-animate examples</title>
<script>document.documentElement.dataset.theme = 'light'; // README images are always light</script>
<!-- Source page for the README images. Serve the repo root (python3 -m http.server) and run examples/capture.sh. -->
<link rel="stylesheet" href="../pele-animate.css">
<style>
  body { font: 16px sans-serif; margin: 0; padding: 1rem; background: #fff; color: #1f1a33; color-scheme: light; width: 720px; }
  .box { width: 680px; margin: 0 0 1.5rem; padding: 20px; box-sizing: border-box; background: #fff; display: flex; justify-content: center; }
  .pa-scene { margin: 0 0 1.5rem; width: 680px; box-sizing: border-box; }
  pre { margin: 0; font-family: inherit; }
</style>
<script type="module">
import { mount } from '../node_modules/pele/dist/pele.js';
import { icons } from '../glyphs.js';
import '../tabler/computers.js';
import { watch } from '../pele-animate.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';

const flow = `flowchart LR
  A[Client] -->|request| B[API]
  A -->|sign in| C[Auth server]
  C -->|token| A`;
const seq = `sequenceDiagram
  Client->>API: sign in
  API-->>Client: token
  Client->>Data: query with token
  Data-->>Client: result`;
const glyphs = `flowchart LR
  %% pa: 1=C 2=L 3=S
  C@{ icon: "http-get", form: "square", h: 88, label: "Request" }
  L@{ icon: "load-balancer", form: "square", h: 88, label: "Load balancer" }
  S@{ icon: "cloud-computing", form: "square", h: 88, label: "Cloud service" }
  C <-->|route| L
  L <-->|forward| S`;

mermaid.initialize({ startOnLoad: false, theme: 'default' });
for (const [id, src] of [['m1', flow], ['m2', seq]]) {
  const { svg } = await mermaid.render(`mm-${id}`, src);
  document.getElementById(id).innerHTML = svg;
}
for (const [id, src] of [['p1', flow], ['p2', seq]]) mount(document.getElementById(id), src, { icons });
for (const [id, src] of [['a1', flow], ['a2', seq], ['a3', glyphs]]) {
  const el = document.getElementById(id);
  mount(el, src, { icons });
  watch(el, src);
}

// Deterministic frames: pause every animation in `el` and seek. Phase 'intro' = draw-in, 'tokens' = hover loop.
window.start = (id, phase) => {
  const el = document.getElementById(id);
  el.dispatchEvent(new PointerEvent('pointerleave'));
  if (phase === 'intro') { const v = el.querySelector('svg.pele'); v.classList.remove('pa-in', 'pa-done'); void v.getBoundingClientRect(); v.classList.add('pa-in'); }
  else el.dispatchEvent(new PointerEvent('pointerenter'));
  return el.getAnimations({ subtree: true }).find((a) => !(a instanceof CSSAnimation))?.effect.getTiming().duration / 1000 ?? 0;
};
window.seek = (id, t, phase) => {
  for (const a of document.getElementById(id).getAnimations({ subtree: true })) {
    a.pause();
    a.currentTime = a instanceof CSSAnimation ? (phase === 'intro' ? t * 1000 : 1e5) : phase === 'tokens' ? t * 1000 : 0;
  }
};
window.ready = true;
</script>
<div class="box" id="m1"></div><div class="box" id="p1"></div><pre class="d" id="a1"></pre>
<div class="box" id="m2"></div><div class="box" id="p2"></div><pre class="d" id="a2"></pre>
<pre class="d" id="a3"></pre>
