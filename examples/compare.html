<!doctype html><meta charset="utf-8"><title>pele-animate examples</title>
<script>document.documentElement.dataset.theme = 'light'; // README images are always light</script>
<!-- Source page for the README images. Serve the repo root (python3 -m http.server) and run examples/capture.sh. -->
<link rel="stylesheet" href="../pele-animate.css">
<style>
  body { font: 16px sans-serif; margin: 0; padding: 1rem; background: #fff; color: #1f1a33; color-scheme: light; width: 720px; }
  .box { width: 680px; margin: 0 0 1.5rem; padding: 20px; box-sizing: border-box; background: #fff; display: flex; justify-content: center; }
  .pa-scene { margin: 0 0 1.5rem; width: 680px; box-sizing: border-box; }
  pre { margin: 0; font-family: inherit; }
  .mk { position: fixed; top: 0; left: 0; display: flex; } .mk i { width: 6px; height: 6px; background: #000; }
  .cmp { display: flex; gap: 16px; margin: 0 0 1.5rem; width: 1200px; }
  .pn { width: 276px; height: 600px; box-sizing: border-box; padding: 8px; border-radius: 16px; background: #efeafa; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .pn.pa-scene { margin: 0; padding: 8px; }
  .pn { --pele-bg: #efeafa; }
  .pn svg { max-width: 100%; height: auto; }
</style>
<script type="module">
import { mount } from '../node_modules/pele/dist/pele.js';
import { icons } from '../glyphs.js';
for (const c of ['document', 'system', 'text', 'design', 'media']) await import(`../tabler/${c}.js`);
import { watch, prepare } from '../pele-animate.js';
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs';

// Same flow as the home page comparison: written left to right, shown in panels too narrow for it.
const flow = `flowchart LR
  A[Mermaid code] -->|parse| B[Diagram model] -->|lay out and draw| C[SVG on the page]`;
const flowAuto = `flowchart LR
  %% pa: autoplay
  A[Mermaid code] -->|parse| B[Diagram model] -->|lay out and draw| C[SVG on the page]`;
const flowIcons = `flowchart LR
  %% pa: autoplay
  A@{ icon: "file-code", form: "square", h: 88, label: "Mermaid code" }
  B@{ icon: "settings", form: "square", h: 88, label: "Diagram model" }
  C@{ icon: "photo", form: "square", h: 88, label: "SVG on the page" }
  A -->|parse| B
  B -->|lay out and draw| C`;
const seq = `sequenceDiagram
  Client->>API: sign in
  API-->>Client: token
  Client->>Data: query with token
  Data-->>Client: result`;
// The home page hero: what pele-animate does, in autoplay step mode.
const hero = `flowchart LR
  %% pa: autoplay 1=W 2=W>O 3=O>I 4=I>R
  W@{ icon: "file-code", form: "square", h: 88, label: "Mermaid code" }
  O@{ icon: "list-numbers", form: "square", h: 88, label: "Ordered steps" }
  I@{ icon: "palette", form: "square", h: 88, label: "Illustrated scene" }
  R@{ icon: "player-play", form: "square", h: 88, label: "Reader follows along" }
  W -->|pin the order| O
  O -->|add icons| I
  I -->|click through| R`;

mermaid.initialize({ startOnLoad: false, theme: 'default' });
for (const [id, src] of [['c1', flow], ['m2', seq]]) {
  const { svg } = await mermaid.render(`mm-${id}`, src);
  document.getElementById(id).innerHTML = svg;
}
for (const [id, src] of [['c2', flow], ['p2', seq]]) mount(document.getElementById(id), src, { icons });
for (const [id, src] of [['a2', seq]]) {
  const el = document.getElementById(id);
  mount(el, src, { icons });
  watch(el, src);
}

// Autoplay panels (watch reads `autoplay` from the source): real time, recorded to video by capture.sh.
// Each panel flashes its marker square (outside the crop) whenever its loop restarts, so capture.sh can cut one exact loop.
const flash = (id) => { const m = document.getElementById('mk-' + id); m.style.background = '#f00'; setTimeout(() => (m.style.background = '#000'), 250); };
for (const [id, src] of [['c3', flowAuto], ['c4', flowIcons], ['a3', hero]]) {
  const el = document.getElementById(id);
  mount(el, prepare(src), { icons });
  watch(el, src);
  new MutationObserver(() => /^1 \//.test(el.querySelector('.pa-count')?.textContent) && flash(id))
    .observe(el, { subtree: true, childList: true, characterData: true });
}

// Deterministic frames: pause every animation in `el` and seek. Phase 'intro' = draw-in, 'tokens' = hover loop.
window.start = (id, phase) => {
  const el = document.getElementById(id);
  el.dispatchEvent(new PointerEvent('pointerleave'));
  if (phase === 'intro') { const v = el.querySelector('svg.pele'); v.classList.remove('pa-in', 'pa-done'); void v.getBoundingClientRect(); v.classList.add('pa-in'); }
  else el.dispatchEvent(new PointerEvent('pointerenter'));
  return el.getAnimations({ subtree: true }).find((a) => !(a instanceof CSSAnimation))?.effect.getTiming().duration / 1000 ?? 0;
};
window.seek = (id, t, phase) => {
  for (const a of document.getElementById(id).getAnimations({ subtree: true })) {
    a.pause();
    a.currentTime = a instanceof CSSAnimation ? (phase === 'intro' ? t * 1000 : 1e5) : phase === 'tokens' ? t * 1000 : 0;
  }
};
window.ready = true;
</script>
<div class="mk"><i id="mk-c3"></i><i id="mk-c4"></i><i id="mk-a3"></i></div>
<div class="cmp"><div class="pn" id="c1"></div><div class="pn" id="c2"></div><div class="pn" id="c3"></div><div class="pn" id="c4"></div></div>
<pre class="d" id="a3" style="width:680px"></pre>
<div class="box" id="m2"></div><div class="box" id="p2"></div><pre class="d" id="a2"></pre>
